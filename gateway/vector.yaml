# Vector configuration for collecting and forwarding logs to Loki
# Simplified architecture: Only handles logs, traces go directly to Jaeger

sources:
  # Docker logs source for collecting Gateway logs
  gateway_logs:
    type: docker_logs
    include_containers:
      - "gateway-gateway-1"

transforms:
  # Process and enrich logs
  process_logs:
    type: remap
    inputs: ["gateway_logs"]
    source: |
      # Convert message to string with fallback
      msg = to_string(.message) ?? ""

      # Parse JSON logs from Gateway if they are structured
      if starts_with(msg, "{") {
        parsed = parse_json(msg) ?? {}
        . = merge!(., parsed)

        # Extract useful fields from parsed JSON
        if exists(.fields.message) {
          .log_message = .fields.message
        }
        if exists(.level) {
          .log_level = .level
        }
        if exists(.target) {
          .log_target = .target
        }
        if exists(.timestamp) {
          .log_timestamp = .timestamp
        }
      }

      # Add metadata
      .service = "delong-gateway"
      .container = .container_name
      .environment = "development"

  # Optional: Filter logs by level or content
  # Uncomment to enable filtering
  # filter_logs:
  #   type: filter
  #   inputs: ["process_logs"]
  #   condition: |
  #     # Keep only WARN, ERROR levels
  #     .log_level == "WARN" || .log_level == "ERROR" ||
  #     # Or keep logs with specific patterns
  #     contains(string!(.log_message), "error") ||
  #     contains(string!(.log_message), "failed") ||
  #     # Or filter by target/module
  #     .log_target == "gateway::handlers"

  # Optional: Sample logs to reduce volume
  # Uncomment to enable sampling
  # sample_logs:
  #   type: sample
  #   inputs: ["process_logs"]  # or ["filter_logs"] if filtering is enabled
  #   rate: 10  # Keep only 10% of logs (1 out of 10)
  #   key_field: "log_message"  # Sample based on message content for consistency

  # Optional: Throttle logs to limit rate
  # Uncomment to enable throttling
  # throttle_logs:
  #   type: throttle
  #   inputs: ["process_logs"]  # or ["sample_logs"] if sampling is enabled
  #   threshold: 100  # Allow max 100 events per window
  #   window_secs: 60  # Per 60 second window

sinks:
  # Send logs to Loki
  loki:
    type: loki
    inputs: ["process_logs"] # Change to ["filter_logs"], ["sample_logs"], or ["throttle_logs"] if using those transforms
    endpoint: "http://loki:3100"
    encoding:
      codec: json
    labels:
      service: "{{ service }}"
      container: "{{ container }}"
      environment: "{{ environment }}"
      level: "{{ log_level }}"

  # Optional: Console output for debugging
  # Uncomment to see logs in Vector's output
  # console:
  #   type: console
  #   inputs: ["process_logs"]
  #   encoding:
  #     codec: json
  #   target: stdout

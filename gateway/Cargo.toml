[package]
name = "gateway"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# HTTP framework and async runtime
axum = { workspace = true, features = ["multipart", "ws"] }
tokio = { workspace = true, features = ["full"] }
# Async traits
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Time and date handling
chrono = { workspace = true, features = ["serde"] }

# Error handling
anyhow = { workspace = true }

# Tracing and observability
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "tracing-log",
    "fmt",
    "json",
] }
tracing-opentelemetry = { version = "0.31.0" }
opentelemetry = { version = "0.30" }
opentelemetry-otlp = { version = "0.30", features = [
    "grpc-tonic",
    "trace",
    "logs",
] }
opentelemetry_sdk = { version = "0.30.0", features = ["rt-tokio"] }

# UUID generation
uuid = { workspace = true, features = ["v4", "serde"] }

# Error handling
thiserror = { workspace = true }

# HTTP middleware and utilities
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace"] }

# HTTP client for forwarding requests to backend services
reqwest = { version = "0.12.20", features = ["json", "multipart", "stream"] }

# URL encoding/decoding for query parameters
serde_urlencoded = "0.7"
urlencoding = "2.1"

# WebSocket utilities
futures-util = "0.3"

# Random number generation
rand = "0.8"

# Common utilities and middleware
common = { path = "../common" }

# Redis client for caching
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# JWT token validation
jsonwebtoken = "9.3"

# Cryptographic hashing
sha2 = "0.10"

# Environment variables from .env file
dotenvy = "0.15"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "gateway_benchmarks"
harness = false

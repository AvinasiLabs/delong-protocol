[package]
name = "gateway"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# HTTP framework and async runtime
axum = { workspace = true, features = ["multipart", "ws"] }
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Tracing and observability
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "tracing-log",
    "fmt",
    "json",
] }
tracing-opentelemetry = { version = "0.31.0" }
opentelemetry = { version = "0.30" }
opentelemetry-otlp = { version = "0.30", features = [
    "grpc-tonic",
    "trace",
    "logs",
] }
opentelemetry_sdk = { version = "0.30.0", features = ["rt-tokio"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"

# HTTP middleware and utilities
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }

# HTTP client for forwarding requests to backend services
reqwest = { version = "0.12.20", features = ["json", "multipart", "stream"] }

# URL encoding/decoding for query parameters
serde_urlencoded = "0.7"
urlencoding = "2.1"

# WebSocket utilities
futures-util = "0.3"

# Random number generation
rand = "0.8"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "gateway_benchmarks"
harness = false

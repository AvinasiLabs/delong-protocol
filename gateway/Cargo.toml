[package]
name = "gateway"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# HTTP framework and async runtime
axum = { workspace = true, features = ["multipart", "ws"] }
tokio = { workspace = true, features = ["full"] }
# Async traits
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Time and date handling
chrono = { workspace = true, features = ["serde"] }

# Error handling
anyhow = { workspace = true }

# Tracing and observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "tracing-log",
    "fmt",
    "json",
] }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = [
    "grpc-tonic",
    "trace",
    "logs",
] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }

# UUID generation
uuid = { workspace = true, features = ["v4", "serde"] }

# Error handling
thiserror = { workspace = true }

# HTTP middleware and utilities
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace"] }

# HTTP client for forwarding requests to backend services
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }

# URL encoding/decoding for query parameters
serde_urlencoded = { workspace = true }
urlencoding = { workspace = true }

# WebSocket utilities
futures-util = { workspace = true }

# Random number generation
rand = { workspace = true }

# Common utilities and middleware
common = { path = "../common" }

# Core service models and business logic
core = { path = "../core" }

# Redis client for caching
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }

# JWT token validation
jsonwebtoken = { workspace = true }

# Cryptographic hashing
sha2 = { workspace = true }

# Environment variables from .env file
dotenvy = { workspace = true }

# API Documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-scalar = { workspace = true }
serde_yaml = { workspace = true }

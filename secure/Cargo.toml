[package]
name = "secure"
version = "0.2.0"
edition = "2021"

[dependencies]
# Error handling and async
async-trait = "0.1.81"

# Local dependencies
avinapi = { path = "../../avinapi", features = ["axum", "sqlx"] }
common = { path = "../common" }

# HTTP framework
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1.39.2", features = ["full"] }
tokio-util = "0.7.11"

# Serialization
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"

# Database
sqlx = { version = "0.8.0", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
] }

# Configuration and environment
config = "0.14.0"
dotenvy = "0.15.7"

# Logging and tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Time and utilities
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.10.0", features = ["v4"] }
once_cell = "1.19.0"
regex = "1.10.2"
bytes = "1.7.1"
futures = "0.3.30"
futures-util = "0.3.30"

# Cryptography
sha2 = "0.10.8"
aes-gcm = "0.10.3"
hex = "0.4.3"
hkdf = "0.12.4"
ring = "0.17.8"
base64 = "0.22.1"
rand = "0.8.5"
zeroize = { version = "1.8.1", features = ["derive"] }
k256 = "0.13.3"

# Blockchain - Alloy framework
alloy = { version = "0.15", features = ["contract", "full", "node-bindings"] }

# IPFS
ipfs-api = "0.17.0"
ipfs-api-backend-hyper = { version = "0.6.0", features = ["with-send-sync"] }

# HTTP client
reqwest = { version = "0.12.5", features = ["json"] }

# File handling
tar = "0.4.41"
tempfile = "3.12.0"
flate2 = "1.0.31"

# Docker
bollard = "0.17.1"

# Other utilities
thiserror = "1.0.63"
url = "2.5.2"
toml = "0.8.19"

# TEE SDK
dstack-sdk = { git = "https://github.com/Dstack-TEE/dstack.git", version = "0.1.0" }
validator = { workspace = true, features = ["derive"] }

[dev-dependencies]
bytes = "1.7.1"
ctor = "0.2.8"
futures = "0.3.30"
hyper = "1.4.1"
multipart = "0.18.0"
tempfile = "3.12.0"
tower = "0.4.13"
uuid = "1.10.0"

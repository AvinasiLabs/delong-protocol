[package]
name = "delong-core"
version = { workspace = true }
edition = { workspace = true }


[dependencies]
# HTTP framework and async runtime
axum = { version = "0.8.4", features = ["multipart", "ws"] }
tokio = { version = "1.39", features = ["full"] }
async-trait = { version = "0.1" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding/decoding
base64 = "0.21"

# Redis support
deadpool-redis = "0.14"

# Cookie support for authentication
axum-extra = { version = "0.10", features = ["cookie"] }
cookie = "0.18"

# Tracing and observability
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = { version = "1.0" }
thiserror = { version = "1.0" }

# Database operations
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "bigdecimal",
    "ipnetwork",
] }

# Password hashing and authentication
argon2 = { version = "0.5" }
bcrypt = { version = "0.15" }

# Binary data handling
bytes = { version = "1.5" }

# JWT authentication
jsonwebtoken = { version = "9.3" }

# Cryptographic hashing
sha2 = { version = "0.10" }

# HTTP middleware and utilities
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "auth",
    "fs",
    "compression-gzip",
    "timeout",
] }

# Redis caching - using deadpool-redis which includes redis
# redis is re-exported from deadpool-redis to avoid version conflicts

# Email sending
mail-send = { version = "0.5.1" }
mail-builder = "0.4.4"

# File upload handling
multer = { version = "3.1" }
mime = { version = "0.3" }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# URL encoding
urlencoding = { version = "2.1" }

# Data validation
validator = { workspace = true, features = ["derive"] }

# Configuration
config = { version = "0.14" }

# Environment variables
dotenvy = { version = "0.15" }

# Local dependencies
avinapi = { path = "../../avinapi", features = ["axum", "sqlx"] }

# API Documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Random number generation
rand = { version = "0.8" }

# Decimal number handling
bigdecimal = { version = "0.4", features = ["serde"] }
num-traits = { version = "0.2" }
regex = { version = "1.10" }
tokio-tungstenite = "0.27.0"
futures-util.workspace = true

[dev-dependencies]
tokio-test = "0.4"
# axum-test = "15"  # Commented out due to version conflict with axum 0.8
# Email sending
